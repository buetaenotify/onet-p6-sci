<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O-NET ป.6 วิทย์ | โรงเรียนบ้านบือแต</title>
<meta name="theme-color" content="#1F2C6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="O-NET ป.6 วิทย์">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="author" content="นายอับดุลเลาะ มะลี">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin:0; height:100%; background:#0A348A; font-family:system-ui, "Sarabun", sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#EEF2F8; }
  .splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff;
    background:#1F2C6B; transition:opacity .4s; z-index:2; text-align:center; padding:20px; }
  .splash img { width:132px; height:132px; border-radius:30px; box-shadow:0 12px 30px rgba(0,0,0,.35); }
  .splash h1 { font-size:22px; margin:0; } .splash p { margin:0; opacity:.85; font-size:14px; }
  .bar { width:160px; height:6px; border-radius:99px; background:rgba(255,255,255,.2); overflow:hidden; }
  .bar i { display:block; height:100%; width:40%; background:#F5B400; border-radius:99px; animation:mv 1.2s ease-in-out infinite; }
  @keyframes mv { 0%{transform:translateX(-100%)} 100%{transform:translateX(260%)} }
  .splash a { color:#1F2C6B; background:#F5B400; padding:10px 18px; border-radius:12px; text-decoration:none; display:none; font-weight:600; }
  .hide { opacity:0; pointer-events:none; }
  @media (prefers-reduced-motion:reduce){ .bar i{animation:none} }
</style>
</head>
<body>
<div class="splash" id="splash">
  <img src="icon-192.png" alt="ไอคอนระบบติว O-NET ป.6 วิทย์">
  <h1>ระบบติว O-NET ป.6 วิทย์</h1>
  <p>โรงเรียนบ้านบือแต · พัฒนาโดย นายอับดุลเลาะ มะลี</p>
  <div class="bar"><i></i></div>
  <p id="st">กำลังเปิด…</p>
  <a id="open" href="#" target="_top">เปิดระบบแบบเต็มหน้าจอ</a>
</div>
<iframe id="app" title="ระบบติว O-NET ป.6 วิทย์" allow="clipboard-write"></iframe>
<script>
  // ⬇️ วางลิงก์เว็บแอป Google Apps Script (ลงท้ายด้วย /exec) ที่นี่
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzoSo8Tw_Rwpe-8PedRKzZa8XO_FKw0Pda4hAlLBLcSnGELr36CR9mfVE6Blwb3OhQm/exec';

  var f = document.getElementById('app'), sp = document.getElementById('splash'), op = document.getElementById('open');
  op.href = WEBAPP_URL;
  f.onload = function () { sp.classList.add('hide'); };
  f.src = WEBAPP_URL;
  // ถ้าโหลดในกรอบไม่ได้ (เช่น ตั้งค่าให้เฉพาะบัญชีโรงเรียน) ให้มีปุ่มเปิดแบบเต็ม
  setTimeout(function () {
    if (!sp.classList.contains('hide')) { document.getElementById('st').textContent = 'ใช้เวลานานกว่าปกติ'; op.style.display = 'inline-block'; }
  }, 9000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
